# This box has 15.7 GB RAM and a page file pinned to a *full* C: drive (0 bytes
# free), so a daemon dies with a native OOM — "mmap failed to map ... G1 virtual
# space", "out of swap space" — during assembleRelease, not a Java heap OOM.
#
# Two things keep it alive:
#  - SerialGC instead of G1. G1 reserves a large contiguous virtual space up
#    front (that is the exact allocation the crash log fails on); SerialGC needs
#    a fraction of it and is plenty for a single-module R8/D8 run.
#  - a smaller heap (1536m) so the whole daemon fits in physical RAM without
#    touching the (unavailable) page file.
# Bump -Xmx back up only once C: has real free space again.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=384m -XX:ReservedCodeCacheSize=192m -XX:+UseSerialGC -Dfile.encoding=UTF-8

# Keep peak memory down: no cross-module parallelism, a single worker process
# (one fewer JVM to reserve address space for). Slower, but it is what fits.
org.gradle.parallel=false
org.gradle.workers.max=1
org.gradle.configureondemand=true

android.useAndroidX=true

# Kotlin IC caches use relocatable (project-relative) paths. The Flutter pub cache
# lives on C: while this project is on D:, so relativizing plugin sources throws
# "different roots" and the Kotlin daemon fails. Disable IC for plugin builds.
kotlin.incremental=false
kotlin.incremental.useClasspathSnapshot=false
