# This box has 15.7 GB RAM and a page file pinned to a near-full C: drive, so the
# old -Xmx4G daemon hit a *native* OOM (mmap failure, "out of swap space") during
# assembleRelease rather than a Java heap OOM. 2 GB is enough for R8/D8 on this
# app and leaves headroom for the Kotlin compiler, Dart, and the IDE running
# alongside. Bump to 3G only if you see an actual "Java heap space" error.
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m

# Keep peak memory down: no cross-module parallelism, at most two worker
# processes. Slower, but it is what fits.
org.gradle.parallel=false
org.gradle.workers.max=2
org.gradle.configureondemand=true

android.useAndroidX=true

# Kotlin IC caches use relocatable (project-relative) paths. The Flutter pub cache
# lives on C: while this project is on D:, so relativizing plugin sources throws
# "different roots" and the Kotlin daemon fails. Disable IC for plugin builds.
kotlin.incremental=false
kotlin.incremental.useClasspathSnapshot=false
