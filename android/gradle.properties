org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true

# Kotlin IC caches use relocatable (project-relative) paths. The Flutter pub cache
# lives on C: while this project is on D:, so relativizing plugin sources throws
# "different roots" and the Kotlin daemon fails. Disable IC for plugin builds.
kotlin.incremental=false
kotlin.incremental.useClasspathSnapshot=false
