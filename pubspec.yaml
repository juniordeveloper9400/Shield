name: shield
description: SHIELD customer app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # Member sign-in: Firebase Phone Auth (SMS OTP). Config is pulled from the
  # `shield-zabnix` project by `flutterfire configure` — see AuthService.
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.4
  # Persists the local OTP-send throttle (4 requests / hour) across restarts
  # and page reloads. See module/auth/otp_send_throttle.dart.
  shared_preferences: ^2.3.2
  share_plus: ^13.3.0
  image_picker: ^1.2.3
  # Opens the platform dialer for the call-to-order number.
  url_launcher: ^6.3.2
  video_player: ^2.11.1
  # Direct client connection to the Neon Postgres backend. Native only
  # (Android / iOS / desktop) — dart:io sockets, so not Flutter web.
  postgres: ^3.5.12
  # The member-facing writes (sign-in, registration) go over Neon's HTTP SQL
  # endpoint instead of the socket above: plain HTTPS on 443, same behaviour in
  # debug and release, reliable from a phone. See data/neon/neon_http.dart.
  http: ^1.6.0
  # "Your SHIELD store" branch picker map. OpenStreetMap tiles (no API key, no
  # billing); geolocator adds the optional "nearest to me" ranking. Renders the
  # same on the APK and the web build. See registration/store_map_view.dart.
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^13.0.4
  # Resizes an uploaded prescription photo to a small JPEG data URI before it
  # is written to app.prescription.image, so the pharmacy console can view it.
  # Also used by tool/whiten_product_backgrounds.dart.
  image: ^4.5.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/logos/
    - assets/reviews/
    - assets/products/
    - assets/categories/
    - assets/banners/

# Launcher icon generation: `dart run flutter_launcher_icons`.
# The mark is 4500x4500 with no padding of its own, so the adaptive icon gets
# a white background and the foreground is inset to survive the circular mask.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/logos/shield_mark.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/logos/shield_mark.png
  adaptive_icon_foreground_inset: 22
  remove_alpha_ios: true
